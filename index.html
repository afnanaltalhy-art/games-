<!doctype html><html lang='ar' dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>سباق عالمات الأرض</title><link rel='stylesheet' href='style.css'></head><body>
<header><div><h1>🌋 سباق عالمات الأرض ⚡</h1><p>الزلازل والبراكين • الصف الثالث المتوسط</p></div><button id='reset' class='ghost'>إعادة السباق</button></header>
<main><section class='race card'><div class='race-head'><h2>مسار السباق</h2><span>كل نقطة = خطوة للأمام</span></div><div id='lanes'></div></section>
<section class='panel'><div class='card game'><div class='game-top'><div><small>نوع التحدي</small><h2 id='type'>اختيار من متعدد</h2></div><div id='timerBox'><b id='timer'>30</b><span>ثانية</span></div></div><div id='question' class='question'></div><div id='options' class='options'></div><div id='answer' class='answer hidden'></div><div class='actions'><button id='newQ'>سؤال جديد</button><button id='showA' class='secondary'>إظهار الإجابة</button><button id='timerBtn' class='secondary'>ابدأ ٣٠ ثانية</button></div></div>
<div class='card control'><h2>لوحة الدرجات</h2><p class='hint'>اختاري الطالبة ثم أضيفي أو اخصمي النقاط.</p><div id='scores'></div></div></section>
<section class='card leaderboard'><h2>🏆 الترتيب الحالي</h2><div id='ranking'></div></section></main>
<footer>الابتدائية والمتوسطة الأولى بصخيبرة • لعبة صفية تفاعلية</footer><script src='app.js'></script></body></html>
